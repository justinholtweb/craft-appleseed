name: craft-appleseed
type: php
docroot: ""
php_version: "8.5"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
omit_containers: [db]
use_dns_when_possible: true
composer_version: "2"
corepack_enable: false

# Appleseed is a plugin package, not a site. This DDEV project exists so the test suite runs on a
# pinned PHP with none of the host's own configuration bleeding in. The suite needs no database
# server: it runs a real Craft 6 install with Appleseed on in-memory SQLite.
#
#   ddev start
#   ddev composer install
#   ddev test                 # Pest: unit + feature
#   ddev test --filter=Scans
#   ddev analyse              # PHPStan (Larastan, level 6) and Pint
